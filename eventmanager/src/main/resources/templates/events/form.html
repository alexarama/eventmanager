<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Eveniment</title>
</head>
<body>
<div layout:fragment="content">
    <h2 th:text="${event.id == null ? 'Adaugă eveniment' : 'Editează eveniment'}"></h2>

    <form th:action="${event.id == null ? '/events' : '/events/' + event.id}"
          th:object="${event}" method="post" class="mt-3">

        <div class="mb-3">
            <label class="form-label">Nume *</label>
            <input type="text" class="form-control" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Descriere</label>
            <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Data start *</label>
                <input type="datetime-local" class="form-control" th:field="*{startDate}"
                       th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{startDate}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Data final *</label>
                <input type="datetime-local" class="form-control" th:field="*{endDate}"
                       th:classappend="${#fields.hasErrors('endDate')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:errors="*{endDate}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Locuri disponibile *</label>
            <input type="number" class="form-control" th:field="*{availableSpots}"
                   th:classappend="${#fields.hasErrors('availableSpots')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{availableSpots}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>
            <select class="form-select" th:field="*{status}">
                <option th:each="status : ${T(com.example.eventmanager.model.Event.EventStatus).values()}"
                        th:value="${status}" th:text="${status}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Locație</label>
            <select class="form-select" th:field="*{location}">
                <option value="">-- Selectează locație --</option>
                <option th:each="location : ${locations}"
                        th:value="${location.id}"
                        th:text="${location.name}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Categorie</label>
            <select class="form-select" th:field="*{category}">
                <option value="">-- Selectează categorie --</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Grup</label>
            <select class="form-select" th:field="*{eventGroup}">
                <option value="">-- Selectează grup --</option>
                <option th:each="group : ${eventGroups}"
                        th:value="${group.id}"
                        th:text="${group.name}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Salvează</button>
        <a href="/events" class="btn btn-secondary">Anulează</a>
    </form>

    <script>
        (function() {
            'use strict';
            const form = document.querySelector('form');
            form.addEventListener('submit', function(event) {
                let valid = true;

                const name = document.getElementById('name');
                if (!name.value.trim()) {
                    name.classList.add('is-invalid');
                    valid = false;
                } else {
                    name.classList.remove('is-invalid');
                }

                const startDate = document.getElementById('startDate');
                const endDate = document.getElementById('endDate');
                if (startDate.value && endDate.value && endDate.value <= startDate.value) {
                    endDate.classList.add('is-invalid');
                    endDate.nextElementSibling.textContent = 'Data de final trebuie să fie după data de start';
                    valid = false;
                }

                const spots = document.getElementById('availableSpots');
                if (!spots.value || spots.value < 0) {
                    spots.classList.add('is-invalid');
                    valid = false;
                }

                if (!valid) {
                    event.preventDefault();
                    event.stopPropagation();
                }
            });
        })();
    </script>
</div>
</body>
</html>
