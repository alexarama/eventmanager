<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Detalii eveniment</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="${event.name}"></h2>
        <div>
            <a th:href="@{/events/{id}/edit(id=${event.id})}" class="btn btn-warning">
                <i class="bi bi-pencil"></i> Editează
            </a>
            <a href="/events" class="btn btn-secondary">Înapoi</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Descriere:</strong> <span th:text="${event.description}"></span></p>
                    <p><strong>Data start:</strong> <span th:text="${#temporals.format(event.startDate, 'dd.MM.yyyy HH:mm')}"></span></p>
                    <p><strong>Data final:</strong> <span th:text="${#temporals.format(event.endDate, 'dd.MM.yyyy HH:mm')}"></span></p>
                    <p><strong>Status:</strong> <span th:text="${event.status}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Locuri disponibile:</strong> <span th:text="${event.availableSpots}"></span></p>
                    <p><strong>Locație:</strong> <span th:text="${event.location?.name}"></span></p>
                    <p><strong>Categorie:</strong> <span th:text="${event.category?.name}"></span></p>
                    <p><strong>Grup:</strong> <span th:text="${event.eventGroup?.name}"></span></p>
                </div>
            </div>
        </div>
    </div>

    <h4>Înregistrare la eveniment</h4>
    <form th:action="@{/registrations/event/{eventId}/participant/{participantId}(eventId=${event.id}, participantId=1)}"
          method="post" class="mt-3 mb-3" id="registrationForm">
        <div class="mb-3">
            <label class="form-label">ID Participant *</label>
            <input type="number" class="form-control" id="participantId" name="participantId"
                   min="1" required placeholder="Introdu ID-ul participantului"/>
            <div class="invalid-feedback">ID-ul participantului este obligatoriu</div>
        </div>
        <button type="submit" class="btn btn-success">
            <i class="bi bi-person-plus"></i> Înregistrează
        </button>
    </form>

    <a th:href="@{/registrations/event/{id}(id=${event.id})}" class="btn btn-info mb-3">
        <i class="bi bi-people"></i> Vezi înregistrări
    </a>

    <script>
        (function() {
            'use strict';
            const form = document.getElementById('registrationForm');
            form.addEventListener('submit', function(event) {
                const participantId = document.getElementById('participantId');
                if (!participantId.value || participantId.value < 1) {
                    participantId.classList.add('is-invalid');
                    event.preventDefault();
                    event.stopPropagation();
                } else {
                    const action = form.action.replace('/participant/1', '/participant/' + participantId.value);
                    form.action = action;
                }
            });
        })();
    </script>
</div>
</body>
</html>
