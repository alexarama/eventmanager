<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<head>
    <title>Detalii eveniment</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="${event.name}"></h2>
        <div>
            <a th:href="@{/events/{id}/edit(id=${event.id})}" class="btn btn-warning"
               sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-pencil"></i> Editează
            </a>
            <a href="/events" class="btn btn-secondary">Înapoi</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Descriere:</strong> <span th:text="${event.description}"></span></p>
                    <p><strong>Data start:</strong> <span th:text="${#temporals.format(event.startDate, 'dd.MM.yyyy HH:mm')}"></span></p>
                    <p><strong>Data final:</strong> <span th:text="${#temporals.format(event.endDate, 'dd.MM.yyyy HH:mm')}"></span></p>
                    <p><strong>Status:</strong> <span th:text="${event.status}"></span></p>
                </div>
                <div class="col-md-6">
                    <p><strong>Locuri disponibile:</strong> <span th:text="${event.availableSpots}"></span></p>
                    <p><strong>Locație:</strong> <span th:text="${event.location?.name}"></span></p>
                    <p><strong>Categorie:</strong> <span th:text="${event.category?.name}"></span></p>
                    <p><strong>Grup:</strong> <span th:text="${event.eventGroup?.name}"></span></p>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-warning mb-3" sec:authorize="hasRole('ADMIN')">
        <strong><i class="bi bi-key"></i> Token de înregistrare:</strong>
        <code th:text="${event.joinToken}"></code>
        <br>
        <small>Trimite acest link participanților:
            <a th:href="@{/join/{token}(token=${event.joinToken})}"
               th:text="${'http://localhost:8080/join/' + event.joinToken}"></a>
        </small>
    </div>

    <div sec:authorize="hasRole('ADMIN')">
        <h4>Înregistrare la eveniment</h4>
        <form th:action="@{/registrations/event/{eventId}/participant/{participantId}(eventId=${event.id}, participantId=0)}"
              method="post" class="mt-3 mb-3" id="registrationForm">
            <div class="mb-3">
                <label class="form-label">Participant *</label>
                <select class="form-select" id="participantSelect" required>
                    <option value="">-- Selectează participant --</option>
                    <option th:each="participant : ${participants}"
                            th:value="${participant.id}"
                            th:text="${participant.lastName + ' ' + participant.firstName + ' (' + participant.email + ')'}">
                    </option>
                </select>
                <div class="invalid-feedback">Selectează un participant</div>
            </div>
            <button type="submit" class="btn btn-success">
                <i class="bi bi-person-plus"></i> Înregistrează
            </button>
        </form>

        <div class="d-flex gap-2 mb-3">
            <a th:href="@{/registrations/event/{id}(id=${event.id})}" class="btn btn-info">
                <i class="bi bi-people"></i> Vezi înregistrări
            </a>
            <a th:href="@{/events/{id}/export(id=${event.id})}" class="btn btn-success">
                <i class="bi bi-download"></i> Export CSV
            </a>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            const form = document.getElementById('registrationForm');
            if (form) {
                form.addEventListener('submit', function(event) {
                    const select = document.getElementById('participantSelect');
                    if (!select.value) {
                        select.classList.add('is-invalid');
                        event.preventDefault();
                        event.stopPropagation();
                    } else {
                        const action = form.action.replace('/participant/0', '/participant/' + select.value);
                        form.action = action;
                    }
                });
            }
        })();
    </script>
</div>
</body>
</html>
