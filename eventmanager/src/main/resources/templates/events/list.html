<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<head>
    <title>Evenimente</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Evenimente</h2>
        <a href="/events/new" class="btn btn-primary"
           sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-plus"></i> Adaugă eveniment
        </a>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>
                <a th:href="@{/events(sortBy='name', direction=${direction == 'asc' ? 'desc' : 'asc'})}">
                    Nume
                </a>
            </th>
            <th>
                <a th:href="@{/events(sortBy='startDate', direction=${direction == 'asc' ? 'desc' : 'asc'})}">
                    Data start
                </a>
            </th>
            <th>Status</th>
            <th>Locuri disponibile</th>
            <th>Categorie</th>
            <th>Acțiuni</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td th:text="${event.name}"></td>
            <td th:text="${#temporals.format(event.startDate, 'dd.MM.yyyy HH:mm')}"></td>
            <td>
                <span th:text="${event.status}"
                      th:classappend="${event.status.name() == 'OPEN'} ? 'badge bg-success' :
                                     (${event.status.name() == 'CLOSED'} ? 'badge bg-danger' : 'badge bg-warning')">
                </span>
            </td>
            <td th:text="${event.availableSpots}"></td>
            <td th:text="${event.category?.name}"></td>
            <td>
                <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-sm btn-info">
                    <i class="bi bi-eye"></i>
                </a>
                <a th:href="@{/events/{id}/edit(id=${event.id})}" class="btn btn-sm btn-warning"
                   sec:authorize="hasRole('ADMIN')">
                    <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{/events/{id}/delete(id=${event.id})}" method="post" class="d-inline"
                      sec:authorize="hasRole('ADMIN')">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Ești sigur?')">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${events.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${events.first} ? 'disabled'">
                <a class="page-link" th:href="@{/events(page=${events.number - 1}, sortBy=${sortBy}, direction=${direction})}">Anterior</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, events.totalPages - 1)}"
                th:classappend="${i == events.number} ? 'active'">
                <a class="page-link" th:href="@{/events(page=${i}, sortBy=${sortBy}, direction=${direction})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${events.last} ? 'disabled'">
                <a class="page-link" th:href="@{/events(page=${events.number + 1}, sortBy=${sortBy}, direction=${direction})}">Următor</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
