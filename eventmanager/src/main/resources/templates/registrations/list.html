<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Înregistrări</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Înregistrări</h2>
        <a href="/events" class="btn btn-secondary">Înapoi la evenimente</a>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Participant</th>
            <th>Eveniment</th>
            <th>
                <a th:href="@{/registrations/event/{id}(id=${eventId}, sortBy='registrationDate', direction=${direction == 'asc' ? 'desc' : 'asc'})}">
                    Data înregistrării
                </a>
            </th>
            <th>
                <a th:href="@{/registrations/event/{id}(id=${eventId}, sortBy='status', direction=${direction == 'asc' ? 'desc' : 'asc'})}">
                    Status
                </a>
            </th>
            <th>Acțiuni</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="registration : ${registrations}">
            <td th:text="${registration.participant.firstName + ' ' + registration.participant.lastName}"></td>
            <td th:text="${registration.event.name}"></td>
            <td th:text="${#temporals.format(registration.registrationDate, 'dd.MM.yyyy HH:mm')}"></td>
            <td th:text="${registration.status}"></td>
            <td>
                <form th:action="@{/registrations/{id}/delete(id=${registration.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Ești sigur?')">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${registrations.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${registrations.first} ? 'disabled'">
                <a class="page-link" th:href="@{/registrations/event/{id}(id=${eventId}, page=${registrations.number - 1}, sortBy=${sortBy}, direction=${direction})}">Anterior</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, registrations.totalPages - 1)}"
                th:classappend="${i == registrations.number} ? 'active'">
                <a class="page-link" th:href="@{/registrations/event/{id}(id=${eventId}, page=${i}, sortBy=${sortBy}, direction=${direction})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${registrations.last} ? 'disabled'">
                <a class="page-link" th:href="@{/registrations/event/{id}(id=${eventId}, page=${registrations.number + 1}, sortBy=${sortBy}, direction=${direction})}">Următor</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
