<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Event Manager">Event Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/events">
            <i class="bi bi-calendar-event"></i> Event Manager
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/events">Evenimente</a>
            <a class="nav-link" href="/dashboard" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a class="nav-link" href="/participants" sec:authorize="hasRole('ADMIN')">Participanți</a>
            <a class="nav-link" href="/locations" sec:authorize="hasRole('ADMIN')">Locații</a>
            <a class="nav-link" href="/categories" sec:authorize="hasRole('ADMIN')">Categorii</a>
            <a class="nav-link" href="/event-groups" sec:authorize="hasRole('ADMIN')">Grupuri</a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm ms-2">Logout</button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div layout:fragment="content"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
