<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Participant</title>
</head>
<body>
<div layout:fragment="content">
    <h2 th:text="${participant.id == null ? 'Adaugă participant' : 'Editează participant'}"></h2>

    <form th:action="${participant.id == null ? '/participants' : '/participants/' + participant.id}"
          th:object="${participant}" method="post" class="mt-3">

        <div class="mb-3">
            <label class="form-label">Nume *</label>
            <input type="text" class="form-control" th:field="*{lastName}"
                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{lastName}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Prenume *</label>
            <input type="text" class="form-control" th:field="*{firstName}"
                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{firstName}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email *</label>
            <input type="email" class="form-control" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Telefon</label>
            <input type="text" class="form-control" th:field="*{phone}"/>
        </div>

        <button type="submit" class="btn btn-primary">Salvează</button>
        <a href="/participants" class="btn btn-secondary">Anulează</a>
    </form>
</div>
</body>
</html>
