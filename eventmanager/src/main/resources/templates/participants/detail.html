<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}">
<head>
    <title>Detalii participant</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="${participant.firstName + ' ' + participant.lastName}"></h2>
        <div>
            <a th:href="@{/participants/{id}/edit(id=${participant.id})}" class="btn btn-warning"
               sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-pencil"></i> Editează
            </a>
            <a href="/participants" class="btn btn-secondary">Înapoi</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <p><strong>Email:</strong> <span th:text="${participant.email}"></span></p>
            <p><strong>Telefon:</strong> <span th:text="${participant.phone}"></span></p>
        </div>
    </div>

    <div class="d-flex gap-2">
        <a th:href="@{/registrations/participant/{id}(id=${participant.id})}" class="btn btn-info">
            <i class="bi bi-calendar-check"></i> Înregistrări
        </a>
        <a th:href="@{/notifications/participant/{id}(id=${participant.id})}" class="btn btn-secondary">
            <i class="bi bi-bell"></i> Notificări
        </a>
    </div>
</div>
</body>
</html>
