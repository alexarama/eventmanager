<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Notificări</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Notificări</h2>
        <a href="/participants" class="btn btn-secondary">Înapoi la participanți</a>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Mesaj</th>
            <th>Tip</th>
            <th>Data</th>
            <th>Citit</th>
            <th>Acțiuni</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="notification : ${notifications}"
            th:classappend="${!notification.read} ? 'table-warning'">
            <td th:text="${notification.message}"></td>
            <td th:text="${notification.type}"></td>
            <td th:text="${#temporals.format(notification.sentAt, 'dd.MM.yyyy HH:mm')}"></td>
            <td>
                <i th:class="${notification.read} ? 'bi bi-check-circle-fill text-success' : 'bi bi-circle text-warning'"></i>
            </td>
            <td>
                <form th:if="${!notification.read}"
                      th:action="@{/notifications/{id}/read(id=${notification.id})}"
                      method="post" class="d-inline">
                    <input type="hidden" name="participantId" th:value="${participantId}"/>
                    <button type="submit" class="btn btn-sm btn-success">
                        <i class="bi bi-check"></i>
                    </button>
                </form>
                <form th:action="@{/notifications/{id}/delete(id=${notification.id})}"
                      method="post" class="d-inline">
                    <input type="hidden" name="participantId" th:value="${participantId}"/>
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Ești sigur?')">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${notifications.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:classappend="${notifications.first} ? 'disabled'">
                <a class="page-link" th:href="@{/notifications/participant/{id}(id=${participantId}, page=${notifications.number - 1})}">Anterior</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, notifications.totalPages - 1)}"
                th:classappend="${i == notifications.number} ? 'active'">
                <a class="page-link" th:href="@{/notifications/participant/{id}(id=${participantId}, page=${i})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${notifications.last} ? 'disabled'">
                <a class="page-link" th:href="@{/notifications/participant/{id}(id=${participantId}, page=${notifications.number + 1})}">Următor</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
