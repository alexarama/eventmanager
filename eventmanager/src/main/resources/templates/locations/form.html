<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Locație</title>
</head>
<body>
<div layout:fragment="content">
    <h2 th:text="${location.id == null ? 'Adaugă locație' : 'Editează locație'}"></h2>

    <form th:action="${location.id == null ? '/locations' : '/locations/' + location.id}"
          th:object="${location}" method="post" class="mt-3">

        <div class="mb-3">
            <label class="form-label">Nume *</label>
            <input type="text" class="form-control" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Adresă *</label>
            <input type="text" class="form-control" th:field="*{address}"
                   th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{address}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Oraș</label>
            <input type="text" class="form-control" th:field="*{city}"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Țară</label>
            <input type="text" class="form-control" th:field="*{country}"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Capacitate</label>
            <input type="number" class="form-control" th:field="*{capacity}"/>
        </div>

        <button type="submit" class="btn btn-primary">Salvează</button>
        <a href="/locations" class="btn btn-secondary">Anulează</a>
    </form>

    <script>
        (function() {
            'use strict';
            const form = document.querySelector('form');
            form.addEventListener('submit', function(event) {
                let valid = true;

                const name = document.getElementById('name');
                if (!name.value.trim()) {
                    name.classList.add('is-invalid');
                    valid = false;
                } else {
                    name.classList.remove('is-invalid');
                }

                const address = document.getElementById('address');
                if (!address.value.trim()) {
                    address.classList.add('is-invalid');
                    valid = false;
                } else {
                    address.classList.remove('is-invalid');
                }

                if (!valid) {
                    event.preventDefault();
                    event.stopPropagation();
                }
            });
        })();
    </script>
</div>
</body>
</html>
