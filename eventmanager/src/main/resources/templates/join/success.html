<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Înregistrare reușită</title>
</head>
<body>
<div layout:fragment="content">
    <div class="card mx-auto text-center" style="max-width: 500px;">
        <div class="card-body py-5">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
            <h2 class="mt-3">Înregistrare reușită!</h2>
            <p class="text-muted">Te-ai înregistrat cu succes la evenimentul:</p>
            <h4 th:text="${event.name}"></h4>
            <p><strong>Data:</strong> <span th:text="${#temporals.format(event.startDate, 'dd.MM.yyyy HH:mm')}"></span></p>
            <p><strong>Locație:</strong> <span th:text="${event.location?.name}"></span></p>
            <a href="/events" class="btn btn-primary mt-3">
                <i class="bi bi-calendar-event"></i> Înapoi la evenimente
            </a>
        </div>
    </div>
</div>
</body>
</html>
