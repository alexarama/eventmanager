<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Categorie</title>
</head>
<body>
<div layout:fragment="content">
    <h2 th:text="${category.id == null ? 'Adaugă categorie' : 'Editează categorie'}"></h2>

    <form th:action="${category.id == null ? '/categories' : '/categories/' + category.id}"
          th:object="${category}" method="post" class="mt-3">

        <div class="mb-3">
            <label class="form-label">Nume *</label>
            <input type="text" class="form-control" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Descriere</label>
            <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Salvează</button>
        <a href="/categories" class="btn btn-secondary">Anulează</a>
    </form>
</div>
</body>
</html>
