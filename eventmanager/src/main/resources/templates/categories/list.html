<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Categorii</title>
</head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Categorii</h2>
        <a href="/categories/new" class="btn btn-primary">
            <i class="bi bi-plus"></i> Adaugă categorie
        </a>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>Nume</th>
            <th>Descriere</th>
            <th>Acțiuni</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="category : ${categories}">
            <td th:text="${category.name}"></td>
            <td th:text="${category.description}"></td>
            <td>
                <a th:href="@{/categories/{id}/edit(id=${category.id})}" class="btn btn-sm btn-warning">
                    <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{/categories/{id}/delete(id=${category.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-danger"
                            onclick="return confirm('Ești sigur?')">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
